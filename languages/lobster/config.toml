name = "Lobster"
grammar = "lobster"
path_suffixes = ["lobster"]
line_comments = ["// "]
tab_size = 4
hard_tabs = false
word_characters = ["_"]
autoclose_before = ";:.,=}])>"
brackets = [
    { start = "(", end = ")", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = "{", end = "}", close = true, newline = true },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
    { start = "'", end = "'", close = true, newline = false, not_in = ["string", "comment"] },
]
increase_indent_pattern = ":\\s*(//.*)?$"
decrease_indent_patterns = [
    { pattern = "^\\s*elif\\b.*:", valid_after = ["if", "elif"] },
    { pattern = "^\\s*else\\s*:", valid_after = ["if", "elif"] },
    { pattern = "^\\s*(case|default|out_of_range)\\b.*:", valid_after = ["case"] },
]
